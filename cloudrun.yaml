# Cloud Run service `portfolio`: Anubis ingress (challenge front) + Nuxt sidecar.
#
# DEPLOY: use `npm run deploy` (scripts/deploy.sh). It regenerates a replace
# spec from the LIVE service, swaps only the Nuxt image tag, bumps the revision
# name, stages the new revision at 0% behind the `anubis` tag, smoke-tests it,
# then promotes to 100%. It leaves the anubis container byte-identical, so the
# bot-challenge front cannot regress.
#
# This file is a point-in-time snapshot for audit/manual use, NOT the deploy
# input. It is the live export with these read-only/output fields removed:
#   - run.googleapis.com/urls, run.googleapis.com/ingress-status (system output)
#   - run.googleapis.com/client-name, run.googleapis.com/client-version (client info)
#   - run.googleapis.com/startupProbeType label (its "Default" value is wrong here)
# `gcloud run services replace` rejects the first two and does not need the rest.
#
# To regenerate by hand:
#   gcloud run services describe portfolio --region northamerica-northeast1 \
#     --project bencost --format=export \
#     | grep -v -e 'run.googleapis.com/urls' -e 'run.googleapis.com/ingress-status' \
#               -e 'run.googleapis.com/client-name' -e 'run.googleapis.com/client-version' \
#               -e 'run.googleapis.com/startupProbeType' -e '^      labels:$'
#
# If you replace from this file manually, bump spec.template.metadata.name first
# (reusing a revision name is rejected) and reconcile the traffic block.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  annotations:
    run.googleapis.com/ingress: all
    runapps.googleapis.com/integrations: router/custom-domains
    runapps.googleapis.com/integrations.router.custom-domains: '2024-03-20T08:12:27.898975Z'
  labels:
    cloud.googleapis.com/location: northamerica-northeast1
    run.googleapis.com/satisfiesPzs: 'true'
  name: portfolio
  namespace: '560755223819'
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: '5'
        run.googleapis.com/container-dependencies: '{"anubis":["nuxt"]}'
        run.googleapis.com/startup-cpu-boost: 'true'
      name: portfolio-00022-jiw
    spec:
      containerConcurrency: 80
      containers:
      - name: anubis
        image: northamerica-northeast1-docker.pkg.dev/bencost/bencost-portfolio/anubis:1.28.1
        ports:
        - containerPort: 8080
          name: http1
        env:
        # Anubis does not read $PORT and binds :8923 by default; this must equal
        # containerPort above.
        - name: BIND
          value: ':8080'
        - name: TARGET
          value: http://127.0.0.1:3000
        - name: POLICY_FNAME
          value: /data/cfg/botPolicy.yaml
        # Without this Anubis logs "REDIRECT_DOMAINS is not set..." -- an open
        # redirect that can carry a visitor's validated pass-cookie to an
        # attacker's site. Comma-separated, no scheme, subdomains not implied.
        # The `anubis` tag host is the staging/challenge entry point.
        - name: REDIRECT_DOMAINS
          value: benco.st,www.benco.st,anubis---portfolio-arr63gnagq-nn.a.run.app
        # Fixed signing key: unset, every instance and revision mints its own and
        # invalidates visitors' pass-cookies.
        - name: ED25519_PRIVATE_KEY_HEX
          valueFrom:
            secretKeyRef:
              name: anubis-ed25519-key
              key: latest
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
        startupProbe:
          failureThreshold: 1
          periodSeconds: 240
          tcpSocket:
            port: 8080
          timeoutSeconds: 240
      # Sidecar. PORT is injected into the ingress container only, so Nitro
      # falls back to 3000 exactly as it does under compose.
      - name: nuxt
        image: northamerica-northeast1-docker.pkg.dev/bencost/bencost-portfolio/nuxtlio:1.5.0-b673f56
        env:
        - name: PORT
          value: '3000'
        resources:
          limits:
            cpu: 1000m
            memory: 512Mi
        startupProbe:
          failureThreshold: 1
          periodSeconds: 240
          tcpSocket:
            port: 3000
          timeoutSeconds: 240
      serviceAccountName: 560755223819-compute@developer.gserviceaccount.com
      timeoutSeconds: 300
  traffic:
  - latestRevision: true
    percent: 100
  - revisionName: portfolio-00022-jiw
    tag: anubis
  - revisionName: portfolio-00018-wif
    tag: nuxt