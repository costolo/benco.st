# Cloud Run service `portfolio` with Anubis as the ingress container and Nuxt as
# a sidecar. Deploy with `gcloud run services replace` -- it is the only surface
# that accepts startup probes and container start ordering, and both are needed
# so Anubis does not 502 while Nitro is still booting.
#
# Regenerate from the live service before editing:
#   gcloud run services describe portfolio --region northamerica-northeast1 \
#     --format="export"
# System-output annotations (run.googleapis.com/urls, .../ingress-status) and the
# run.googleapis.com/startupProbeType label are deliberately omitted: the first
# two are regenerated by Cloud Run, and the last one asserts the probe is the
# synthesized default, which is no longer true here.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: portfolio
  namespace: '560755223819'
  annotations:
    run.googleapis.com/ingress: all
    # Load-bearing: this is what binds benco.st to the service.
    runapps.googleapis.com/integrations: router/custom-domains
    runapps.googleapis.com/integrations.router.custom-domains: '2024-03-20T08:12:27.898975Z'
  labels:
    cloud.googleapis.com/location: northamerica-northeast1
    run.googleapis.com/satisfiesPzs: 'true'
spec:
  template:
    metadata:
      # Explicit so the traffic tag below resolves in the same replace. Bump the
      # suffix on every attempt; reusing a name is rejected.
      name: portfolio-anubis-1
      annotations:
        autoscaling.knative.dev/maxScale: '5'
        run.googleapis.com/startup-cpu-boost: 'true'
        # anubis starts only after nuxt's startup probe passes.
        run.googleapis.com/container-dependencies: '{"anubis":["nuxt"]}'
    spec:
      serviceAccountName: 560755223819-compute@developer.gserviceaccount.com
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
      # Ingress: the only container with an exposed port, so the only one
      # reachable from outside. Nuxt has no external address at all.
      - name: anubis
        image: northamerica-northeast1-docker.pkg.dev/bencost/bencost-portfolio/anubis:1.28.1
        ports:
        - containerPort: 8080
          name: http1
        env:
        # Anubis does not read $PORT and binds :8923 by default; this must equal
        # containerPort above.
        - name: BIND
          value: ':8080'
        - name: TARGET
          value: http://127.0.0.1:3000
        - name: POLICY_FNAME
          value: /data/cfg/botPolicy.yaml
        # Without this Anubis logs "REDIRECT_DOMAINS is not set, Anubis will
        # redirect to any domain" -- an open redirect that can carry a visitor's
        # validated pass-cookie to an attacker's site. Comma-separated, no scheme,
        # subdomains not implied. Must include the staging tag host or the
        # post-challenge redirect fails with "Redirect domain not allowed".
        - name: REDIRECT_DOMAINS
          value: benco.st,<anubis-tag-host>
        # Fixed signing key: unset, every instance and revision mints its own and
        # invalidates visitors' pass-cookies.
        - name: ED25519_PRIVATE_KEY_HEX
          valueFrom:
            secretKeyRef:
              name: anubis-ed25519-key
              key: latest
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
        # Same field values the live single-container revision already uses.
        startupProbe:
          failureThreshold: 1
          periodSeconds: 240
          tcpSocket:
            port: 8080
          timeoutSeconds: 240
      # Sidecar. Unchanged image: PORT is injected into the ingress container
      # only, so Nitro falls back to 3000 exactly as it does under compose.
      - name: nuxt
        image: northamerica-northeast1-docker.pkg.dev/bencost/bencost-portfolio/nuxtlio:1.5.0
        env:
        - name: PORT
          value: '3000'
        resources:
          limits:
            cpu: 1000m
            memory: 512Mi
        startupProbe:
          failureThreshold: 1
          periodSeconds: 240
          tcpSocket:
            port: 3000
          timeoutSeconds: 240
  # Pinned: the service normally runs latestRevision: true, which would
  # auto-promote the new revision to 100% on creation. The pre-existing `nuxt`
  # tag is preserved so the old rollback URL keeps resolving.
  traffic:
  - revisionName: portfolio-00015-sig
    percent: 100
  - revisionName: portfolio-00015-sig
    tag: nuxt
  - revisionName: portfolio-anubis-1
    tag: anubis
